name: Upload verified Linux release package
on:
  push:
    branches: ['build/v1.0.1-linux']
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: assets
          run-id: 45326319219
          github-token: ${{ github.token }}
      - name: Verify and upload draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum -c ./*.sha256
          release=$(gh api repos/"$GH_REPO"/releases/456306557)
          test "$(jq -r .draft <<< "$release")" = true
          url=$(jq -r '.upload_url | split("{")[0]' <<< "$release")
          for file in *; do
            hash="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            bytes=$(stat -c '%s' "$file")
            asset=$(jq --arg name "$file" '.assets[] | select(.name == $name)' <<< "$release")
            if [ -z "$asset" ]; then
              asset=$(curl --fail-with-body --silent --show-error \
                -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Content-Type: application/octet-stream' --data-binary @"$file" \
                "$url?name=$file")
            fi
            jq -e --arg digest "$hash" --argjson size "$bytes" \
              '.state == "uploaded" and .digest == $digest and .size == $size' <<< "$asset"
            printf '%s %s bytes %s\n' "$file" "$bytes" "$hash"
          done
