name: Build Linux release package
on:
  push:
    branches: ['build/v1.0.1-linux']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 xvfb xauth
      - name: Build frontend
        run: |
          npm ci --prefix vtools_ui/webapp/frontend
          npm run build --prefix vtools_ui/webapp/frontend
      - name: Build and verify the portable directory
        run: |
          python -m pip install -r requirements.txt PyInstaller QtPy
          python packaging/build_app.py
          cmp model_compression/core/interrupted_run.py dist/v_compression/_internal/model_compression/core/interrupted_run.py
          dist/v_compression/v_compression --help
          cd dist
          tar -czf v_compression-1.0.1-linux-amd64.tar.gz v_compression
          sha256sum v_compression-1.0.1-linux-amd64.tar.gz > v_compression-1.0.1-linux-amd64.tar.gz.sha256
          stat -c '%n %s bytes' v_compression-1.0.1-linux-amd64.tar.gz
          cat v_compression-1.0.1-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/v_compression-1.0.1-linux-amd64.tar.gz
            dist/v_compression-1.0.1-linux-amd64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
